set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod gzio
insmod part_gpt
insmod part_msdos
terminal_output gfxterm

set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-cyan

menuentry "Lipi OS (Live)" {
    linux /live/vmlinuz boot=live components quiet hostname=lipi-os lipi.os=1
    initrd /live/initrd.img
}

menuentry "Lipi OS (Live, debug)" {
    linux /live/vmlinuz boot=live components hostname=lipi-os lipi.os=1 debug
    initrd /live/initrd.img
}

menuentry "Boot from first disk" {
    exit
}
