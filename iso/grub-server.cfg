set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod gzio
insmod part_gpt
insmod part_msdos
insmod chain
terminal_output gfxterm

set menu_color_normal=light-green/black
set menu_color_highlight=black/light-green

menuentry "Lipi OS Server (CLI)" {
    linux /live/vmlinuz boot=live components quiet hostname=lipi-server lipi.os=1 lipi.edition=server
    initrd /live/initrd.img
}

menuentry "Lipi OS Server (debug)" {
    linux /live/vmlinuz boot=live components hostname=lipi-server lipi.os=1 lipi.edition=server debug
    initrd /live/initrd.img
}

menuentry "Boot from first disk" {
    set root=(hd0)
    chainloader +1
}
